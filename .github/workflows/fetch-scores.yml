name: Fetch Scores

on:
  schedule:
    # Every 30 minutes during the tournament (11 June – 19 July 2026) so live
    # scores and prize standings stay fresh. Outside those dates nothing
    # changes, so the runs are cheap no-ops (no commit, no deploy).
    - cron: '*/30 * 11-30 6 *'
    - cron: '*/30 * 1-19 7 *'
    # Daily baseline the rest of the year (fixture/schedule changes).
    - cron: '0 23 * * *'
  workflow_dispatch:         # manual trigger from GitHub Actions UI

permissions:
  contents: write
  actions: write             # needed to kick off the Pages deploy

concurrency:
  group: fetch-scores
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch scores from football-data.org
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-scores.js

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scores.json data/bookings.json data/fixture-map.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes — skipping commit"
          else
            git commit -m "chore: update scores $(date -u '+%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't fire `on: push` workflows, so the
      # Pages deploy has to be triggered explicitly when the data changed.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
